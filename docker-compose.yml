services:
  postgresqldb:
    image: postgres:18
    restart: on-failure:3
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/mirekkkob/dce-backend:1.0
    restart: on-failure:3
    depends_on:
      postgresqldb:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5000/healthcheck | grep -q 'Server is running' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/mirekkkob/dce-frontend:1.0
    restart: on-failure:3
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net

networks:
  frontend_net:
  backend_net:

volumes:
  pgdata: